plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
}

android {
    compileSdk 35
    namespace = "app.preplotus"
//    compileSdkVersion 34
//    buildToolsVersion "30.0.3"


    defaultConfig {
        applicationId "app.preplotus"
        minSdkVersion 23
        targetSdkVersion 35
        versionCode 4
        versionName "1.3"
        multiDexEnabled true
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {

        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    sourceSets {
        main {
            res {
                srcDirs 'src\\main\\res', 'src\\main\\res\\drawable-xhdpi'
            }
        }
    }
//    buildFeatures {
//        dataBinding true
//    }
    viewBinding {
        enabled = true
    }
}

dependencies {

    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'androidx.vectordrawable:vectordrawable:1.2.0'
    implementation 'androidx.navigation:navigation-fragment:2.9.3'

//    implementation "androidx.startup:startup-runtime:1.0.0"

    implementation 'androidx.navigation:navigation-ui:2.9.3'
    implementation "androidx.lifecycle:lifecycle-livedata:2.9.2"
    implementation "androidx.lifecycle:lifecycle-viewmodel:2.9.2"
    implementation "androidx.lifecycle:lifecycle-runtime:2.9.2" // or the latest version
    implementation "androidx.startup:startup-runtime:1.2.0" // or the latest version
    implementation "androidx.fragment:fragment:1.8.9"

    implementation project(path: ':meowbottomnavigation')
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'

//    implementation 'com.agrawalsuneet.androidlibs:dotsloader:1.2.3'
//    implementation 'com.facebook.android:facebook-android-sdk:[5,6)'
    implementation 'com.facebook.android:facebook-android-sdk:18.1.3'
//    implementation 'com.facebook.android:facebook-android-sdk:latest.release'
    implementation 'de.hdodenhof:circleimageview:3.1.0'
    implementation 'com.squareup.picasso:picasso:2.5.2'
    implementation 'com.intuit.sdp:sdp-android:1.1.0'

//    implementation 'com.jakewharton:butterknife:10.2.3'
//    annotationProcessor 'com.jakewharton:butterknife-compiler:10.2.3'

    implementation 'com.squareup.retrofit2:retrofit:2.10.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.10.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:3.9.0'

    implementation 'com.google.android.gms:play-services-auth:21.4.0'

    implementation platform('com.google.firebase:firebase-bom:34.1.0')
    implementation 'com.google.firebase:firebase-messaging'
//    implementation 'com.facebook.android:facebook-android-sdk:[5,6)'
    implementation 'com.razorpay:checkout:1.6.41'

    implementation 'com.github.bumptech.glide:glide:4.13.1'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.13.1'
    implementation 'com.google.android.exoplayer:exoplayer:2.19.1'
    implementation 'com.facebook.android:facebook-login:latest.release'



}



